services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops}
      POSTGRES_DB: ops_tasks
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # Exposed on localhost only, for `make api` during development.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops_tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ops:${POSTGRES_PASSWORD:-ops}@db:5432/ops_tasks?sslmode=disable
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Vancouver}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
